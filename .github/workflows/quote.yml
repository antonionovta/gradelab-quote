name: Quote of the day

# Fetches BrainyQuote's Funny Quote of the Day server-side and
# publishes quote.json, which the GradeLab app reads. Runs a few
# times a day so BrainyQuote's US-time rollover is always caught;
# a failed fetch leaves the last good quote.json untouched.
on:
  schedule:
    - cron: '30 5,9,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch today's quote
        run: python3 quote_fetch.py
      - name: Commit if changed
        run: |
          git config user.name "quote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quote.json
          git diff --cached --quiet || (git commit -m "Quote of the day" && git push)
